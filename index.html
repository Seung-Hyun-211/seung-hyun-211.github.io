<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이승현의 기록</title><style>:root{--bg:#0b1017;--card:#121b25;--line:#263545;--text:#e9f0f7;--muted:#8ea0b3;--blue:#78d7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1b3043,#0b1017 42%);color:var(--text);font:15px/1.75 system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--blue)}.shell{display:grid;grid-template-columns:270px minmax(0,880px);gap:48px;max-width:1240px;margin:auto;padding:28px}.side{position:sticky;top:28px;height:calc(100vh - 56px)}.profile,.card,.post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}.avatar{width:78px;height:78px;border-radius:50%;border:3px solid #3c5368}.name{margin:12px 0 0}.muted{color:var(--muted)}.small{font-size:.82rem}.side h4{margin:28px 0 8px;color:#698096;text-transform:uppercase;letter-spacing:.14em;font-size:.7rem}.side a.item{display:block;padding:7px 10px;border-left:2px solid transparent;color:var(--muted)}.side a.item:hover{border-color:var(--blue);background:#182532;color:var(--text)}.repo{display:block;padding:7px 0;color:var(--muted);font-size:.88rem}.repo small{display:block;color:#5e7386}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}.hero{padding:62px 0 44px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.14em;font-size:.72rem}.hero h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.05;letter-spacing:-.06em;margin:14px 0}.hero p{max-width:650px;color:var(--muted);font-size:1.05rem}.section{padding:40px 0}.section h2{margin:0 0 18px}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input,.toolbar select{width:100%;padding:11px 13px;background:#0f1720;color:var(--text);border:1px solid var(--line);border-radius:9px}.toolbar select{max-width:180px}.posts{display:grid;gap:12px}.post{display:block;padding:20px 22px;transition:.2s}.post:hover{border-color:var(--blue);transform:translateY(-2px)}.post h3{margin:5px 0;font-size:1.18rem}.post p{margin:0;color:var(--muted)}.tag{display:inline-block;color:var(--blue);font-size:.75rem;margin-right:8px}.article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,5vw,52px)}.article h1{line-height:1.25;margin-top:0}.article h2{margin-top:34px;color:#c9efff}.article h3{margin-top:26px;color:#dcecf5}.article ul{padding-left:22px}.article li{margin:7px 0}.article table{width:100%;border-collapse:collapse;margin:18px 0}.article th,.article td{border:1px solid var(--line);padding:10px;text-align:left}.article th{color:var(--blue);background:#0f1720}.article pre{overflow:auto;padding:16px;background:#081018;border:1px solid var(--line);border-radius:10px;color:#b9e6ff}.back{display:inline-block;margin-bottom:24px;color:var(--blue)}@media(max-width:800px){.shell{display:block;padding:18px}.side{position:static;height:auto;margin-bottom:20px}.toolbar{display:block}.toolbar select{max-width:none;margin-top:8px}.hero{padding-top:28px}.article table{font-size:.82rem}}</style></head><body><div class="shell"><aside class="side"><div class="profile"><img class="avatar" src="https://github.com/Seung-Hyun-211.png?size=160" alt="이승현 프로필"><h2 class="name">이승현</h2><p class="muted small">게임 개발 · 그래픽스 · 기록</p><p class="muted small">만들고, 부수고, 다시 설계합니다.</p></div><h4>Categories</h4><a class="item" href="#">전체 기록</a><a class="item" href="#cat-unreal">언리얼</a><a class="item" href="#cat-shader">셰이더</a><a class="item" href="#cat-book">책</a><a class="item" href="#cat-cs">CS</a><h4>Links</h4><a class="repo" href="https://github.com/Seung-Hyun-211">GitHub<small>@Seung-Hyun-211</small></a><a class="repo" href="https://beie-myong.tistory.com/">원본 블로그<small>Tistory</small></a></aside><main><div class="top"><span>SEUNG-HYUN-211.GITHUB.IO</span><span id="count"></span></div><section class="hero"><div class="eyebrow">DEVLOG / NOTES</div><h1>생각을 기록하고<br>다음 빌드로 갑니다.</h1><p>게임 개발과 엔진, 렌더링, CS를 공부하며 남긴 실제 기록입니다. 제목만 모아둔 목록이 아니라, 글을 선택하면 이 사이트 안에서 본문을 읽을 수 있습니다.</p></section><section id="list" class="section"><h2>최근 기록</h2><div class="toolbar"><input id="q" placeholder="글 검색"><select id="cat"><option value="">모든 분류</option><option>언리얼</option><option>셰이더</option><option>책</option><option>CS</option><option>취미</option></select></div><div id="posts" class="posts"></div></section><section id="detail" hidden></section></main></div><script>const full42='<h2>CPU 아키텍처 학습 노트</h2><h3>1. 아키텍처란?</h3><p>아키텍처는 CPU가 이해하고 실행할 수 있는 명령어와 동작의 규칙을 정의합니다. 소프트웨어는 컴파일러를 통해 이 규칙에 맞는 기계어를 만들고, CPU는 그 명령어를 실행합니다.</p><h3>2. x86_64 (= AMD64)</h3><ul><li>Intel x86 32비트를 AMD가 64비트로 확장했기 때문에 AMD64라고도 부릅니다.</li><li>CISC 방식이라 하나의 명령어가 메모리 접근과 연산처럼 복잡한 작업을 수행할 수 있습니다.</li><li>Intel·AMD 데스크톱, 노트북, 서버에서 널리 사용됩니다.</li><li>명령어 길이가 1~15바이트로 가변적이고, 기존 호환성을 위해 레거시가 많이 누적되어 있습니다.</li></ul><h3>3. ARM64 (= AArch64)</h3><ul><li>ARM의 64비트 명령어 집합입니다.</li><li>RISC 방식이라 단순한 명령어를 조합해 복잡한 작업을 수행합니다.</li><li>스마트폰, Apple Silicon M 시리즈, AWS Graviton, Raspberry Pi 등에 사용됩니다.</li><li>명령어가 4바이트로 고정되고 레지스터가 31개라 디코딩과 전력 효율에 유리합니다.</li></ul><table><tr><th>항목</th><th>x86_64</th><th>ARM64</th></tr><tr><td>설계 철학</td><td>CISC</td><td>RISC</td></tr><tr><td>명령어 길이</td><td>가변</td><td>고정 4바이트</td></tr><tr><td>전력 효율</td><td>상대적으로 낮음</td><td>높음</td></tr><tr><td>주요 기기</td><td>PC·서버</td><td>스마트폰·신형 Mac·클라우드</td></tr></table><p>Apple은 2020년부터 Intel Mac에서 Apple Silicon으로 전환했고, AWS도 ARM 서버를 제공합니다. 따라서 크로스 플랫폼 빌드에서는 아키텍처 차이를 확인해야 합니다.</p><pre><code>docker build --platform linux/amd64 .
docker build --platform linux/arm64 .</code></pre><h2>4. 마이크로아키텍처 이론</h2><h3>4.1 ISA와 마이크로아키텍처</h3><p>ISA가 CPU가 무엇을 할 수 있는지를 정의한다면, 마이크로아키텍처는 그 명령어를 회로가 어떻게 구현하는지를 정의합니다. 같은 ARM64라도 Apple M 시리즈, Qualcomm Snapdragon, AWS Graviton은 내부 구현이 다릅니다.</p><h3>4.2 파이프라이닝</h3><p>명령어를 Fetch → Decode → Execute → Memory → Writeback 단계로 나누고 여러 명령어의 단계를 겹쳐 처리합니다. 구조적·데이터·제어 해저드가 발생하면 대기나 플러시가 필요합니다.</p><h3>4.3 분기 예측</h3><p>CPU는 조건문 결과를 미리 예측해 파이프라인을 채웁니다. 예측이 맞으면 성능을 얻지만 틀리면 파이프라인을 비워야 하고 수십 사이클이 손실될 수 있습니다. Spectre와 Meltdown은 추측 실행과 캐시 흔적을 이용한 대표적인 보안 이슈입니다.</p><h3>4.4 슈퍼스칼라와 4.5 OoOE</h3><p>슈퍼스칼라 CPU는 한 사이클에 여러 명령어를 실행합니다. OoOE(Out-of-Order Execution)는 독립적인 뒤쪽 명령어를 먼저 실행하고 결과를 재정렬 버퍼에서 원래 순서로 정리합니다. 레지스터 리네이밍은 가짜 의존성도 줄여줍니다.</p><h3>4.6 캐시 계층</h3><ul><li>레지스터: 거의 0사이클</li><li>L1: 약 4사이클, 32~64KB</li><li>L2: 약 12사이클, 수백 KB~1MB</li><li>L3: 약 40사이클, 수~수십 MB</li><li>DRAM: 200사이클 이상</li></ul><p>캐시 미스가 발생하면 CPU는 느린 하위 계층이나 메모리를 기다려야 합니다.</p><h3>4.7 x86과 ARM의 이론적 차이</h3><p>x86은 가변 길이 명령어 때문에 디코더가 복잡하고, ARM은 고정 길이 명령어라 디코딩이 단순합니다. 다만 최신 x86 CPU도 내부적으로 CISC 명령어를 RISC와 비슷한 마이크로옵으로 변환해 실행합니다.</p>';const posts=[{id:42,title:'iOS 빌드관련 아키텍처',date:'2026.09.16',cat:'CS',body:full42},{id:41,title:'이런 저런 기능추가',date:'2026.09.16',cat:'',body:'블로그에 필요한 기능을 추가하고 사용성을 점검한 기록입니다.'},{id:40,title:'폭발은 예술이다.',date:'2026.09.10',cat:'취미',body:'폭발 효과와 연출을 관찰하며 정리한 기록입니다.'},{id:39,title:'AI로 GPU 구박하기',date:'2026.09.10',cat:'취미',body:'AI와 GPU를 활용해 실험한 과정을 남겼습니다.'},{id:38,title:'AI로 엔진 없이 게임을 만들어보기',date:'2026.09.09',cat:'취미',body:'게임 제작의 기본 구조를 엔진 없이 실험한 기록입니다.'},{id:37,title:'Steam sdk 멀티연동',date:'2026.09.07',cat:'유니티',body:'Steam SDK를 이용한 멀티플레이 연동 과정을 정리했습니다.'},{id:36,title:'언리얼 인벤토리 시스템',date:'2026.07.28',cat:'언리얼',body:'언리얼에서 인벤토리 시스템을 구성하며 고민한 내용을 정리했습니다.'},{id:35,title:'Palworld 건설 셰이더',date:'2026.07.25',cat:'셰이더',body:'건설 오브젝트 표현을 위한 셰이더 실험 기록입니다.'}];const postsEl=document.querySelector('#posts');const detail=document.querySelector('#detail');function render(){const q=document.querySelector('#q').value.toLowerCase();const c=document.querySelector('#cat').value;const filtered=posts.filter(p=>(!q||(p.title+p.body).toLowerCase().includes(q))&&(!c||p.cat===c));document.querySelector('#count').textContent=filtered.length+' posts';postsEl.innerHTML=filtered.map(p=>'<a class="post" href="#post-'+p.id+'"><span class="tag">'+(p.cat||'NOTE')+'</span><span class="muted small">'+p.date+'</span><h3>'+p.title+'</h3><p>'+p.body.replace(/<[^>]+>/g,' ').slice(0,150)+'...</p></a>').join('')}function route(){const id=location.hash.match(/post-(\d+)/);if(!id){document.querySelector('#list').hidden=false;detail.hidden=true;render();return}const p=posts.find(x=>x.id==id[1]);if(!p)return;document.querySelector('#list').hidden=true;detail.hidden=false;detail.innerHTML='<div class="article"><a class="back" href="#">← 목록으로</a><div class="muted small">'+p.date+' · '+(p.cat||'NOTE')+'</div><h1>'+p.title+'</h1>'+p.body+'</div>'}document.querySelector('#q').oninput=render;document.querySelector('#cat').onchange=render;addEventListener('hashchange',route);route();</script></body></html>
