<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이승현의 기록</title><style>:root{--bg:#0b1017;--card:#121b25;--line:#263545;--text:#e9f0f7;--muted:#8ea0b3;--blue:#78d7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1b3043,#0b1017 42%);color:var(--text);font:15px/1.7 system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--blue)}.shell{display:grid;grid-template-columns:270px minmax(0,880px);gap:48px;max-width:1240px;margin:auto;padding:28px}.side{position:sticky;top:28px;height:calc(100vh - 56px)}.profile,.card,.post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}.avatar{width:78px;height:78px;border-radius:50%;border:3px solid #3c5368}.name{margin:12px 0 0}.muted{color:var(--muted)}.small{font-size:.82rem}.side h4{margin:28px 0 8px;color:#698096;text-transform:uppercase;letter-spacing:.14em;font-size:.7rem}.side a.item{display:block;padding:7px 10px;border-left:2px solid transparent;color:var(--muted)}.side a.item:hover{border-color:var(--blue);background:#182532;color:var(--text)}.repo{display:block;padding:7px 0;color:var(--muted);font-size:.88rem}.repo small{display:block;color:#5e7386}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}.hero{padding:62px 0 44px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.14em;font-size:.72rem}.hero h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.05;letter-spacing:-.06em;margin:14px 0}.hero p{max-width:650px;color:var(--muted);font-size:1.05rem}.section{padding:40px 0}.section h2{margin:0 0 18px}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input,.toolbar select{width:100%;padding:11px 13px;background:#0f1720;color:var(--text);border:1px solid var(--line);border-radius:9px}.toolbar select{max-width:180px}.posts{display:grid;gap:12px}.post{display:block;padding:20px 22px;transition:.2s}.post:hover{border-color:var(--blue);transform:translateY(-2px)}.post h3{margin:5px 0;font-size:1.18rem}.post p{margin:0;color:var(--muted)}.tag{display:inline-block;margin-top:10px;padding:2px 9px;border-radius:99px;background:#173144;color:var(--blue);font-size:.74rem}.back{display:inline-block;margin-bottom:24px;color:var(--blue)}.article{font-size:1.03rem}.article h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.15}.article h2{margin-top:34px}.article pre{overflow:auto;padding:18px;background:#081018;border:1px solid var(--line);border-radius:10px;color:#b9e6ff}.article code{color:#b9e6ff}.footer{padding:28px 0;border-top:1px solid var(--line);color:#607286;font-size:.8rem}@media(max-width:820px){.shell{display:block;padding:18px}.side{position:static;height:auto}.side h4,.repo{display:none}.profile{display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center}.profile .avatar{grid-row:span 3}.profile .name,.profile .handle,.profile p{margin:0}.top{padding-top:24px}.toolbar{display:block}.toolbar select{max-width:none;margin-top:8px}}</style></head><body><div class="shell"><aside class="side"><div class="profile"><img class="avatar" src="https://github.com/Seung-Hyun-211.png?size=240" alt="이승현 프로필"><h2 class="name">이승현</h2><div class="handle muted small">@Seung-Hyun-211</div><p class="muted small">개발과 배움에 관한 기록입니다.</p><a href="https://github.com/Seung-Hyun-211">GitHub 프로필 ↗</a></div><h4>분류</h4><nav><a class="item" href="#">전체 글 <span id="count">0</span></a><a class="item" href="#" data-cat="언리얼">언리얼</a><a class="item" href="#" data-cat="책">책</a><a class="item" href="#" data-cat="취미">취미</a><a class="item" href="#" data-cat="셰이더">셰이더</a><a class="item" href="#" data-cat="CS">CS</a></nav><h4>GitHub projects</h4><a class="repo" href="https://github.com/Seung-Hyun-211/usn">usn<small>repository ↗</small></a><a class="repo" href="https://github.com/Seung-Hyun-211/PixelAniMaker">PixelAniMaker<small>repository ↗</small></a></aside><main><div class="top"><span>/ home</span><span>실시간 글 목록</span></div><header class="hero"><div class="eyebrow">PERSONAL BLOG / 2026</div><h1>개발하고, 실험하고,<br>기록합니다.</h1><p>티스토리에서 이어온 기록을 실제로 검색하고 읽을 수 있는 GitHub 블로그로 옮겼습니다.</p></header><section class="section"><div class="toolbar"><input id="search" placeholder="글 제목이나 내용 검색"><select id="category"><option value="all">모든 분류</option><option>언리얼</option><option>책</option><option>취미</option><option>셰이더</option><option>CS</option><option>유니티</option></select></div><div id="view"></div></section><footer class="footer">Built with GitHub Pages · <a href="https://beie-myong.tistory.com/">티스토리 원문 아카이브 ↗</a></footer></main></div><script>const posts=[{id:42,title:'iOS 빌드관련 아키텍처',cat:'CS',date:'2026.09.16',desc:'CPU 아키텍처와 ISA, x86_64, ARM64의 차이를 정리한 학습 노트입니다.',body:'명령어 집합 구조(ISA)는 CPU가 이해하고 실행할 수 있는 명령어들의 규격입니다. x86_64와 ARM64의 특징, 사용처, 명령어 방식의 차이를 살펴봅니다.',url:'https://beie-myong.tistory.com/42'},{id:41,title:'이런 저런 기능추가',cat:'취미',date:'2026.09.16',desc:'사격, 폭발, 지연폭발, 화염, 장판 기능을 실험한 기록입니다.',body:'게임 속 다양한 상호작용 효과를 추가하면서 기능을 분리하고 순서를 제어한 과정을 정리했습니다.',url:'https://beie-myong.tistory.com/41'},{id:40,title:'폭발은 예술이다.',cat:'취미',date:'2026.09.10',desc:'VAT와 SoA를 이용해 다수의 좀비와 폭발 효과를 구현했습니다.',body:'VAT와 SoA를 이용해 많은 오브젝트를 생성하고 중앙 폭발 효과를 실험했습니다. GPU 성능과 시각 효과의 균형을 확인한 작업입니다.',url:'https://beie-myong.tistory.com/40'},{id:39,title:'AI로 GPU 구박하기',cat:'취미',date:'2026.09.10',desc:'AI에게 구현을 맡겨 좀비 5000개를 생성하고 성능을 실험했습니다.',body:'지식만 가지고 AI에게 구현을 요청한 뒤 실제 결과를 확인했습니다. 많은 오브젝트를 한 번에 처리할 때 병목이 어디에서 생기는지 살펴봤습니다.',url:'https://beie-myong.tistory.com/39'},{id:38,title:'AI로 엔진 없이 게임을 만들어보기',cat:'취미',date:'2026.09.09',desc:'Cpp, DirectX 11, HLSL만으로 게임 구조를 구현했습니다.',body:'엔진이 제공하는 기능을 직접 이해하고 활용하기 위해 렌더링, 입력, 게임 루프를 직접 구성한 실험입니다.',url:'https://beie-myong.tistory.com/38'},{id:37,title:'Steam SDK 멀티연동',cat:'유니티',date:'2026.09.07',desc:'Steam SDK를 활용한 멀티플레이 연동 과정입니다.',body:'Steam SDK를 프로젝트에 연결하고 멀티플레이 기능을 실험한 기록입니다.',url:'https://beie-myong.tistory.com/37'},{id:36,title:'언리얼 인벤토리 시스템',cat:'언리얼',date:'2026.07.28',desc:'아이템 데이터와 드래그 앤 드롭 위치 변경을 지원하는 인벤토리입니다.',body:'아이템 정보를 저장하는 데이터 구조와 인벤토리 컴포넌트를 만들고 UI에서 드래그 앤 드롭으로 슬롯을 변경하도록 구성했습니다.',url:'https://beie-myong.tistory.com/36'},{id:35,title:'Palworld 건설 셰이더',cat:'셰이더',date:'2026.07.25',desc:'건설 진행도에 따른 색상 분할과 중앙 강조선을 구현했습니다.',body:'Object Position을 0에서 1 사이 값으로 변환하고 진행도에 따라 두 색상과 알파를 조절했습니다. 진행선은 Emission으로 강조했습니다.',url:'https://beie-myong.tistory.com/35'}];const view=document.querySelector('#view'),search=document.querySelector('#search'),category=document.querySelector('#category');document.querySelector('#count').textContent=posts.length;function render(){const hash=location.hash;const id=hash.startsWith('#post-')?Number(hash.slice(6)):null;if(id){const p=posts.find(x=>x.id===id);view.innerHTML=p?'<a class="back" href="#">← 목록으로</a><article class="article"><div class="muted small">'+p.date+' · '+p.cat+'</div><h1>'+p.title+'</h1><p class="muted">'+p.desc+'</p><h2>기록</h2><p>'+p.body+'</p><p><a href="'+p.url+'" target="_blank" rel="noopener">티스토리 원문 보기 ↗</a></p></article>':'<p>글을 찾을 수 없습니다.</p>';return}const q=search.value.toLowerCase(),c=category.value;const list=posts.filter(p=>(c==='all'||p.cat===c)&&(p.title+p.desc+p.body).toLowerCase().includes(q));view.innerHTML='<div class="posts">'+list.map(p=>'<a class="post" href="#post-'+p.id+'"><div class="muted small">'+p.date+' · '+p.cat+'</div><h3>'+p.title+'</h3><p>'+p.desc+'</p><span class="tag">'+p.cat+'</span></a>').join('')+'</div>'+(list.length?'':'<p class="muted">검색 결과가 없습니다.</p>')}search.addEventListener('input',render);category.addEventListener('change',render);document.querySelectorAll('[data-cat]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();category.value=a.dataset.cat;render()}));window.addEventListener('hashchange',render);render();</script></body></html>
